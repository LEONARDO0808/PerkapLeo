<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>PERKAP Alfamart · Inventaris Barang Acara</title>
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PERKAP Alfamart" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('perkap_theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=20261120a" />
</head>
<body>

<!-- ================= LOGIN / REGISTER ================= -->
<section id="authScreen" class="auth-screen">
  <button class="icon-btn theme-btn theme-fab" title="Mode gelap/terang" type="button">🌙</button>
  <div class="auth-card">
    <div class="brand brand-auth">
      <img class="brand-img-lg" src="/icons/logo.png" alt="PERKAP Alfamart" />
      <h1>PERKAP Alfamart</h1>
      <p class="brand-sub">Inventaris Barang Acara</p>
    </div>

    <form id="loginForm" class="auth-form">
      <label class="field">
        <span>Nama kamu</span>
        <input type="text" name="nama" autocomplete="name" placeholder="mis. Ardo / Bariq" required minlength="2" maxlength="30" />
      </label>
      <div class="form-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      <p class="auth-hint">Cukup tulis nama. <b>Nama baru</b> otomatis dibuatkan; <b>nama yang sudah ada</b> melanjutkan sesi itu. Semua orang melihat data yang sama.</p>
    </form>
  </div>
</section>

<!-- ================= APP ================= -->
<section id="appScreen" class="app-screen hidden">
  <header class="topbar">
    <div class="topbar-left">
      <img class="brand-img-sm" src="/icons/logo.png" alt="PERKAP Alfamart" />
      <div class="topbar-title">
        <strong>PERKAP Alfamart</strong>
        <span id="whoami">—</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="live-dot" id="liveDot" title="Sinkronisasi realtime"></span>
      <button class="icon-btn theme-btn" title="Mode gelap/terang" type="button">🌙</button>
      <button class="icon-btn" id="logoutBtn" title="Keluar" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
      </button>
    </div>
  </header>

  <main class="content">
    <!-- statistik -->
    <div class="stats" id="stats"></div>

    <!-- pencarian + filter -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
        <input id="searchInput" type="search" placeholder="Cari barang…" />
      </div>
      <div class="filters" id="filters">
        <button class="chip active" data-filter="all" type="button">Semua</button>
        <button class="chip" data-filter="dipakai" type="button">Dipakai</button>
        <button class="chip" data-filter="dipinjam" type="button">Dipinjam</button>
        <button class="chip" data-filter="dikembalikan" type="button">Dikembalikan</button>
      </div>
    </div>

    <!-- daftar barang -->
    <div id="itemList" class="item-list"></div>
    <div id="emptyState" class="empty hidden">
      <div class="empty-emoji">📦</div>
      <p>Belum ada barang. Tekan tombol <b>+</b> untuk menambah.</p>
    </div>
  </main>

  <!-- tombol tambah -->
  <button class="fab" id="addBtn" type="button" title="Tambah barang">
    <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    <span>Tambah</span>
  </button>
</section>

<!-- ================= MODAL FORM ================= -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle">Tambah Barang</h2>
      <button class="icon-btn" id="modalClose" type="button">✕</button>
    </div>
    <form id="itemForm" class="modal-body">
      <input type="hidden" id="itemId" />
      <label class="field">
        <span>Nama barang <b class="req">*</b></span>
        <input type="text" id="namaInput" placeholder="mis. Meja Lipat" required />
      </label>
      <div class="row">
        <label class="field">
          <span>Jumlah <b class="req">*</b></span>
          <input type="number" id="jumlahInput" min="0" step="1" value="1" inputmode="numeric" required />
        </label>
        <label class="field">
          <span>Status</span>
          <select id="statusInput">
            <option value="dipakai">Sedang Dipakai</option>
            <option value="dipinjam">Dipinjam</option>
            <option value="dikembalikan">Sudah Dikembalikan</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span>Keterangan (opsional)</span>
        <input type="text" id="keteranganInput" placeholder="mis. untuk sesi registrasi / dipinjam Budi" />
      </label>
      <div class="form-error" id="itemError"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- loading overlay -->
<div id="loadingOverlay" class="loading-overlay hidden">
  <div class="spinner"></div>
  <div class="loading-text">Memuat…</div>
</div>

<!-- toast -->
<div id="toast" class="toast"></div>

<script src="/app.js?v=20261120a"></script>
</body>
</html>
